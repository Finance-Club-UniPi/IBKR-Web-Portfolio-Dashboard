[project]
name = "archive"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash>=2.18,<4",
    "diskcache>=5.6,<6",
    "ib-async>=2.0,<3",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "plotly>=5.20,<7",
    "pytest>=8.0,<9",
    "python-json-logger>=2.0,<4",
    "pyyaml>=6.0,<7",
    "reportlab>=4.0,<5",
    "requests>=2.28,<3",
    "yfinance~=0.2.40",
]

[tool.ruff]
line-length = 110
# Preserve the original lint policy independently of the runtime version.
target-version = 'py310'

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I', 'UP', 'B']
# E501  long lines allowed in data literals
# E731  lambda assignments are used as compact helpers
# E701/E702  compact one-line `if x: return ...` is deliberate in zone
#            classifiers and coach scenarios
# E402  main.py creates the asyncio loop before importing modules that
#       (transitively) import eventkit at module load
ignore = ['E501', 'E731', 'E701', 'E702', 'E402']
